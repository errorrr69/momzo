name: Restore reference data

# Restores the GLOBAL reference content — the corpus, activities, questions and
# bonding-game banks — from a nightly backup artifact into the linked project.
#
# Deliberately NOT a general restore. It touches only tables that are shared
# reference data, never a family's rows and never auth.users, so it cannot
# resurrect a deleted child or clobber live family data. A full disaster restore
# is a different, more careful operation — see docs/OPERATIONS.md.
#
# Written for the August 2026 project rebuild: the original Supabase project
# became unadministrable when its Google account was lost, and the corpus had to
# move to a project we own. Kept because "put the content back" is a thing you
# want a tested path for, not an improvised one.
#
# Restoring rather than re-seeding also skips ~800 Gemini embedding calls, which
# matters when the Google key is exactly what you have lost.

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Run ID of the "DB Backup" workflow to restore from'
        required: true
        type: string
      confirm:
        description: 'Type the project ref to confirm the target'
        required: true
        type: string
      only_tables:
        description: 'Optional: restore only these tables (comma-separated). Blank = all.'
        required: false
        default: ''
        type: string

jobs:
  restore:
    name: Restore reference tables
    runs-on: ubuntu-latest
    # `actions: read` is what lets this run download another run's artifact.
    # Without it the default token 403s on the artifacts API.
    permissions:
      contents: read
      actions: read
    env:
      PROJECT_REF: uwpmwqsxqociiojeauuk
      POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the target project
        run: |
          if [ "${{ inputs.confirm }}" != "$PROJECT_REF" ]; then
            echo "Confirmation '${{ inputs.confirm }}' does not match $PROJECT_REF — refusing."
            exit 1
          fi
          echo "Target confirmed: $PROJECT_REF"

      # Match the server (Postgres 17). An older client cannot read a 17 dump.
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Fetch the backup artifact
        run: |
          set -euo pipefail
          gh run download "${{ inputs.backup_run_id }}" --repo "$GITHUB_REPOSITORY" --dir ./restore
          # `gh run download` unpacks into a DIRECTORY named after the artifact, and
          # that directory is itself called *.dump — so `find -name '*.dump'` without
          # -type f hands pg_restore a directory and it fails looking for toc.dat.
          DUMP=$(find ./restore -type f -name '*.dump' | head -1)
          if [ -z "$DUMP" ]; then echo "No .dump file found in the artifact"; exit 1; fi
          # A custom-format dump starts with the magic bytes PGDMP.
          if [ "$(head -c 5 "$DUMP")" != "PGDMP" ]; then
            echo "$DUMP is not a custom-format pg_dump"; exit 1
          fi
          ls -lh "$DUMP"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"

      # Session pooler (5432), not the transaction pooler: pg_restore needs a
      # session-mode connection, same reason the backup job uses 5432.
      # No --disable-triggers: that needs superuser, which the postgres role on a
      # managed project is not. pg_restore replays tables in the dump's own
      # dependency order, so foreign keys are satisfied without it.
      #
      # Errors are FATAL here. An earlier version downgraded them to a warning and
      # the job reported success while restoring precisely nothing.
      # TWO PASSES, PARENTS FIRST. pg_restore replays --table selections in the
      # dump's own order, which is alphabetical — so `game_items` arrives before
      # `games` exists and the foreign key rejects the whole COPY. Restoring
      # referenced tables first is the fix; --disable-triggers would also do it but
      # needs superuser, which a managed project's postgres role is not.
      - name: Restore reference tables
        run: |
          set -euo pipefail
          ONLY="${{ inputs.only_tables }}"

          restore() {  # restore <table>...
            local args=()
            for t in "$@"; do
              # Honour only_tables when it was given.
              if [ -n "$ONLY" ] && ! echo ",$ONLY," | grep -q ",$t,"; then continue; fi
              args+=("--table=$t")
            done
            [ ${#args[@]} -eq 0 ] && return 0
            echo "--- restoring: ${args[*]}"
            pg_restore --data-only --no-owner --no-privileges "${args[@]}" \
              -h "$POOLER_HOST" -p 5432 -U "postgres.$PROJECT_REF" -d postgres "$DUMP"
          }

          restore content_cards activities questions games   # parents
          restore content_embeddings game_items              # children

      - name: What landed
        run: |
          psql -h "$POOLER_HOST" -p 5432 -U "postgres.$PROJECT_REF" -d postgres -A -F' | ' -c "
            select 'content_cards'      as table, count(*) from content_cards
            union all select 'content_embeddings', count(*) from content_embeddings
            union all select 'activities',         count(*) from activities
            union all select 'questions',          count(*) from questions
            union all select 'games',              count(*) from games
            union all select 'game_items',         count(*) from game_items
            order by 1;"

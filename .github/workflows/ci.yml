name: CI

# Monorepo CI (Build Guide §4):
#   - app:            flutter analyze (no secrets)
#   - edge-functions: Deno type-check + the AI cost/prompt unit tests, plus the
#                     LLM call-site allowlist guard (Cost Strategy §2). No secrets.
#   - db-checks:      RLS cross-family isolation (Hard Rule #20) + corpus integrity
#                     (Task 1c) + AI cost acceptance (Cost Strategy §4/§5/§8).
#                     Read-only against the project; needs DB secrets.
#   - migrate-deploy: apply migrations + deploy Edge Functions. DELIBERATE only
#                     (manual run) so we never auto-push migrations to prod on every
#                     commit. Needs SUPABASE_ACCESS_TOKEN.
# Secrets come from GitHub Actions secrets — never committed (Build Guide §5).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Flutter app — analyze + layering guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Architecture rule 1: features reach the outside through services, never by
      # importing a backend client. Runs before the Flutter setup because it needs
      # nothing but Node, so a layering break fails fast.
      - name: Layering guard (architecture rule 1)
        working-directory: .
        run: node scripts/check_feature_imports.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Infos (deprecations, prefer_const) shouldn't fail CI; real errors/warnings still do.
      - run: flutter analyze --no-fatal-infos
      # The AI routing tests — the risk table, the on-device guards, cloud fallback,
      # and the native channel contract. They existed for months without CI ever
      # running them, which meant the one safety-critical unit in the app was
      # unverified on every push.
      - run: flutter test

  edge-functions:
    name: Edge Functions — LLM call-site guard + AI cost tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Layer 1 (Cost Strategy §2): fails if a new LLM call site appears outside
      # the approved list. Adding one must always be deliberate.
      - name: LLM call-site guard
        working-directory: supabase/tests
        run: node check_llm_call_sites.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Prompt-prefix stability (§3), cost math (§1), buckets + name guard (§5),
      # and the warm no-shame limit copy (Hard Rule #18). No secrets, no network.
      - name: AI cost unit tests
        run: deno test --allow-env supabase/functions/_shared/
      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts

  db-checks:
    name: RLS isolation + corpus integrity + AI cost
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD:      ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_HOST:      ${{ secrets.SUPABASE_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # supabase-js needs native WebSocket (Node 22+)
      - working-directory: supabase/tests
        run: npm install
      # Cross-family isolation (Hard Rule #20) + the AI cost acceptance suite
      # (semantic-cache bucket isolation, billable-only rate counting, PII-free
      # telemetry). `node --test` picks up every *.test.mjs here.
      - name: RLS + AI cost suites
        working-directory: supabase/tests
        run: npm test
      # No dangling daily_assignments.card_id / ai_messages.cited_card_ids; every
      # published card embedded (Task 1c).
      - name: Corpus integrity
        working-directory: supabase/tests
        run: npm run integrity

  migrate-deploy:
    name: Migrations + functions deploy (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  nngjqhrxbhugnafyviqj
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --include-all
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

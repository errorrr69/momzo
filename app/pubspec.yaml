name: momzo
description: "Momzo — a few cozy minutes a day to understand your child better."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  # Backend: direct Supabase access (RLS-protected) with the anon key only.
  # Secrets-needing calls (AI, WhatsApp) go through Edge Functions, not the app.
  supabase_flutter: ^2.5.6
  # Push notifications (FCM, Task 7). The FCM server key stays server-side (the
  # send happens in an Edge Function); the app only registers + stores its token.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Crash/error reporting (Task 4). PII-scrubbed; DSN injected at build time.
  # 9.x targets a Kotlin languageVersion compatible with the project's Kotlin 2.2.
  sentry_flutter: ^9.0.0
  # On-device text-to-speech for the bonding games' "tap to hear" (free, offline).
  flutter_tts: ^4.2.0
  image_picker: ^1.2.2
  speech_to_text: ^7.4.0
  # Hosts the bundled learning-games SPA (ADR 008). The games ship as assets and
  # talk to the app only through the MomzoBridge JS channel — no network, no
  # Supabase inside the WebView (ADR 009).
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  # Generates every launcher density from one source image, so the icon is one
  # file to change rather than five PNGs to keep in sync.
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# App icon. Regenerate after changing the source images:
#   cd app && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false # no iOS target yet
  # Legacy icon (Android 7 and below, and the Play listing's fallback): the full
  # artwork, edge to edge.
  image_path: assets/icon/icon.png
  # Android 8+ masks icons into a circle/squircle/whatever the launcher chooses,
  # cropping roughly the outer third. So the foreground is the SAME artwork with
  # generous padding, over a flat Momzo cream background — never a photo, and
  # never anything important near the edge.
  adaptive_icon_background: "#FFF7F0" # MomzoColors.cream
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    # The compiled learning-games SPA, vendored from the games repo. Build
    # artifact, not source — see assets/games/README.md for how to regenerate and
    # which commit it came from. Listed as a directory so the hashed filenames
    # change freely between rebuilds without touching this file.
    - assets/games/
    - assets/games/assets/

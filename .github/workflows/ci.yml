name: CI

# Monorepo CI (Build Guide §4):
#   - app:            flutter analyze (no secrets)
#   - db-checks:      RLS cross-family isolation (Hard Rule #20) + corpus integrity
#                     (Task 1c). Read-only against the project; needs DB secrets.
#   - migrate-deploy: apply migrations + deploy Edge Functions. DELIBERATE only
#                     (manual run) so we never auto-push migrations to prod on every
#                     commit. Needs SUPABASE_ACCESS_TOKEN.
# Secrets come from GitHub Actions secrets — never committed (Build Guide §5).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Flutter app — analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  db-checks:
    name: RLS isolation + corpus integrity
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD:      ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_POOLER_HOST:      ${{ secrets.SUPABASE_POOLER_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: supabase/tests
        run: npm install
      # Cross-family isolation — fails on ANY cross-family read/write or an
      # untested owner_id/user_id table (Hard Rule #20).
      - name: RLS suite
        working-directory: supabase/tests
        run: npm test
      # No dangling daily_assignments.card_id / ai_messages.cited_card_ids; every
      # published card embedded (Task 1c).
      - name: Corpus integrity
        working-directory: supabase/tests
        run: npm run integrity

  migrate-deploy:
    name: Migrations + functions deploy (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF:  nngjqhrxbhugnafyviqj
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --include-all
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
